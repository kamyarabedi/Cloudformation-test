AWSTemplateFormatVersion: '2010-09-09'
Description: Simple CloudFormation template to create one VPC and one S3 bucket

Resources:

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: SimpleVPC

  MyS3Bucket:
    Type: AWS::S3::Bucket
